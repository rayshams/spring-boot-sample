spring:
  application:
    name: user-management-service
  datasource:
    url: jdbc:postgresql://localhost:5432/user_management_db
    username: appuser
    password: apppass
    driver-class-name: org.postgresql.Driver

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  database-platform: org.hibernate.dialect.PostgreSQLDialect


server:
  port: 8080